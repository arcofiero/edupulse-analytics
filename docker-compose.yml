x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: "edupulse-secret"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./bronze:/opt/airflow/bronze
    - ./config:/opt/airflow/config
    - ./flink:/opt/airflow/flink
    - ./gold:/opt/airflow/gold
    - ./orchestration:/opt/airflow/orchestration
    - ./pipeline:/opt/airflow/pipeline
    - ./schemas:/opt/airflow/schemas
    - ./silver:/opt/airflow/silver
    - ./simulator:/opt/airflow/simulator
    - ./soda:/opt/airflow/soda
    - ./.local:/opt/airflow/.local
    - ./logs/airflow:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - edupulse

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    networks:
      - edupulse

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -c "airflow db init &&
          airflow users create
          --username admin
          --password admin
          --firstname EduPulse
          --lastname Admin
          --role Admin
          --email admin@edupulse.local"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  flink-jobmanager:
    image: flink:1.18-scala_2.12
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    networks:
      - edupulse

  flink-taskmanager:
    image: flink:1.18-scala_2.12
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    networks:
      - edupulse

  superset:
    image: apache/superset:3.1.0
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: edupulse-superset-secret
    volumes:
      - superset_data:/app/superset_home
      - ./superset:/app/edupulse_superset
      - ./.local/superset:/app/edupulse_superset_data
    depends_on:
      - postgres
    networks:
      - edupulse

volumes:
  postgres_data:
  superset_data:

networks:
  edupulse:
    driver: bridge
