checks for student_engagement_score:
  - row_count > 0
  - duplicate_count(student_id) = 0
  - missing_count(engagement_score) = 0
  - missing_count(risk_score) = 0
  - min(engagement_score) >= 0
  - min(risk_score) >= 0
  - max(risk_score) <= 100
  - invalid_count(dropout_risk_band) = 0:
      valid values: [low, medium, high]

checks for student_risk_signals:
  - row_count > 0
  - missing_count(student_id) = 0
  - missing_count(risk_reasons) = 0
  - missing_count(recommended_action) = 0

checks for advisor_intervention_queue:
  - missing_count(queue_rank) = 0
  - missing_count(recommended_action) = 0

checks for course_content_engagement:
  - row_count > 0
  - min(event_count) > 0

checks for content_difficulty_index:
  - row_count > 0
  - min(difficulty_index) >= 0
  - max(difficulty_index) <= 100
  - invalid_count(content_health_band) = 0:
      valid values: [healthy, watch, needs_review]

checks for department_adoption_weekly:
  - row_count > 0
  - min(active_students) > 0
  - min(adoption_rate) >= 0
  - max(adoption_rate) <= 1

checks for cohort_engagement_summary:
  - row_count > 0
  - missing_count(avg_engagement_score) = 0
  - missing_count(high_risk_rate) = 0
